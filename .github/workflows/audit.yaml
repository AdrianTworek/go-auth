name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Lint and format check
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      # Integration tests share one Postgres container per test binary and clone a
      # migrated template database per test, and hash at bcrypt's minimum cost, so the
      # suite runs in a few minutes even with -race. The explicit timeout is a hang
      # detector with headroom for a slow runner, not a budget to grow into.
      - name: Run tests
        run: go test -race -count=1 -timeout 10m ./...
